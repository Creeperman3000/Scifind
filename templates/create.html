{% extends "base.html" %}
{% block title %}{{ _('create.title') }} — Scifind{% endblock %}
{% block content %}
<style>
  .modal-content h2 { font-size: 1.2rem; margin-bottom: 16px; color: var(--text); }
  .modal-content h3 { font-size: 0.85rem; margin-bottom: 8px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
  .formula-error { display: block; color: var(--text-secondary); min-height: 3.5em; line-height: 3.5em; }
  /* The LaTeX preview's default placeholder text. KaTeX-rendered content
     gets its own colours from the katex stylesheet and is left alone. */
  .formula-placeholder { color: var(--text-secondary); }
  .sql-block {
    background: var(--bg-secondary); border-radius: 8px;
    position: relative; margin-bottom: 16px;
  }
  .sql-block pre {
    font-family: var(--font-mono); font-size: 0.82rem;
    white-space: pre-wrap; padding: 16px 56px 16px 16px;
    margin: 0; min-height: 60px; color: var(--text); overflow-x: auto;
  }
  /* Icon-only copy button inside .sql-block, anchored to the top-right
     corner. Inherits size/color from base.html's .formula-copy-btn. */
  .sql-block > .formula-copy-btn { position: absolute; top: 8px; right: 8px; }
  .token-sidebar { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .token-sidebar .filter-qty-search-wrap { margin-bottom: 0; }
  .token-list { display: flex; flex-direction: column; gap: 4px; max-height: 6000px; overflow: hidden; transition: max-height 0.25s ease; }
  .token-list .qty-result { align-items: center; }
  .token-list[data-collapsed="1"] { max-height: 0; }
  /* "No matches" empty state: hidden by default, shown by JS only when a
     search query returns 0 results. */
  .token-empty { display: none; padding: 4px 0; font-size: 0.78rem; color: var(--text-secondary); font-style: italic; }
  .detail-meta .diff-row { display: flex; align-items: center; gap: 8px; }
  .detail-meta .diff-row .diff-sliders { width: 100px; height: auto; margin: 0; }
  .detail-meta .diff-row .diff-sliders input[type=range],
  .detail-meta .diff-row .diff-track,
  .detail-meta .diff-row .diff-fill { margin: 0; top: 50%; transform: translateY(-50%); }
  .breadcrumb-bar { overflow: visible; }
  .topic-current { position: relative; display: inline-grid; align-items: center; }
  .topic-current > * { grid-area: 1 / 1; }
  .topic-current.has-menu { padding: 0 6px; }
  .topic-current.has-menu::before { content: attr(data-text); visibility: hidden; display: block; }
  .topic-current:not(:last-child) { cursor: pointer; }
  .topic-current:not(:last-child):hover { color: var(--accent); }
  .topic-dropdown-trigger {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-secondary); color: var(--text); font-size: 0.85rem;
    cursor: pointer; font-family: inherit;
    outline: none; box-shadow: none; -webkit-tap-highlight-color: transparent;
  }
  .topic-dropdown-trigger:focus,
  .topic-dropdown-trigger:focus-visible { outline: none; box-shadow: none; }
  .topic-children-menu,
  .topic-submenu {
    background: var(--bg); border: 1px solid var(--border);
    box-shadow: var(--shadow-lg); border-radius: 6px;
    min-width: 180px; max-height: 300px; overflow-y: auto; padding: 4px;
  }
  .topic-children-menu { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 200; }
  .topic-children-menu.open { display: block; }
  .topic-submenu { display: none; position: fixed; z-index: 201; }
  .topic-menu-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; padding: 6px 12px;
    border: none; background: none; cursor: pointer; font-size: 0.85rem;
    color: var(--text); border-radius: 3px; font-family: inherit; position: relative;
  }
  .topic-menu-item:hover { background: var(--bg-secondary); }
  .topic-menu-item .caret {
    width: 0; height: 0;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    border-left: 5px solid var(--text-secondary); margin-left: 8px; flex-shrink: 0;
  }
  /* /create tree: the selected node's radio is always visible; others
     only appear on hover of the right sidebar. */
  #sidebar-right.jstree-radio-mode .jstree-anchor > .jstree-checkbox { opacity: 0; }
  #sidebar-right.jstree-radio-mode:hover .jstree-anchor > .jstree-checkbox { opacity: 1; }
  #sidebar-right.jstree-radio-mode .jstree-clicked > .jstree-checkbox,
  #sidebar-right.jstree-radio-mode .jstree-checked > .jstree-checkbox { opacity: 1; }
  /* Override base.html's #sidebar-right .jstree-container-ul > .jstree-node >
     .jstree-anchor > .jstree-checkbox { opacity: 1 !important; } which makes
     root-level checkboxes always visible on other pages. On /create they should
     follow the same hover-only visibility as non-root nodes. */
  #sidebar-right.jstree-radio-mode .jstree-container-ul > .jstree-node > .jstree-anchor > .jstree-checkbox { opacity: 0 !important; }
  #sidebar-right.jstree-radio-mode:hover .jstree-container-ul > .jstree-node > .jstree-anchor > .jstree-checkbox { opacity: 1 !important; }
  #sidebar-right.jstree-radio-mode .jstree-container-ul > .jstree-node.jstree-clicked > .jstree-anchor > .jstree-checkbox,
  #sidebar-right.jstree-radio-mode .jstree-container-ul > .jstree-node.jstree-checked > .jstree-anchor > .jstree-checkbox { opacity: 1 !important; }

  /* /create: hide the "deselect all" button. The "reset" button is
     rewired to clear the topic selection. */
  #sidebar-right.jstree-radio-mode #tree-deselect-all { display: none; }

  /* /create: language picker only. Everything else in the create modal
     reuses base.html's .text-field, .detail-desc, .btn-primary, .var-table
     classes so it looks identical to the main form. */
  /* Pick-languages dialog: jstree-style checkboxes (16x16, 2px border,
     accent fill + checkmark when checked). The lang code is gray and
     wrapped in parens. */
  .lang-picker { display: flex; flex-direction: column; gap: 4px; padding: 4px 0; }
  .lang-picker .lang-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 4px; cursor: pointer; }
  .lang-picker .lang-row:hover { background: var(--bg-secondary); }
  .lang-picker .lang-code { color: var(--text-secondary); font-size: 0.85em; margin-left: 4px; }
  .lang-picker .lang-cb { width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 3px; background: none; cursor: pointer; flex-shrink: 0; display: inline-block; position: relative; }
  .lang-picker .lang-row input:checked + .lang-cb { background: var(--accent); border-color: var(--accent); }
  .lang-picker .lang-row input:checked + .lang-cb::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .lang-picker input[type=checkbox] { position: absolute; opacity: 0; pointer-events: none; }
  /* Per-quantity row in the per-language table: render the localised
     symbol with KaTeX (matches the main .var-table behaviour). */
  .var-table .qty-symbol { display: inline-block; min-width: 1.5em; }
  /* Translate-form label row: label text on the left, copy-from-en button
     on the right. The button uses base.html's .filter-btn (same look as
     the sidebar's reset tree button). */
  .tr-label-row { display: flex; align-items: center; gap: 6px; }
  .tr-label-row .filter-btn { margin-left: auto; }
  /* Quantity overrides table: unoccupied placeholder rows are visually
     muted so the user can see at a glance which quantities are filled. */
  .var-table tr.qty-row-placeholder { opacity: 0.4; }
  .var-table tr.qty-row-placeholder input[disabled] { background: transparent; cursor: default; }
  /* Occurrence tag on duplicate rows (e.g. "m" appearing twice in a formula
     with no alias). Muted, monospace so it doesn't visually compete with the
     quantity name. */
  .var-table .qty-occ { color: var(--text-secondary); font-family: var(--font-mono, monospace); font-size: 0.85em; margin-left: 4px; }
  /* Per-language form: vertical spacing between the individual fields.
     We share base.html's .detail-desc class for the field labels, but
     scope padding/margin adjustments to .translate-form so the same
     class isn't affected elsewhere. */
  .translate-form { display: flex; flex-direction: column; gap: 12px; }
  .translate-form > .detail-desc { margin: 0; padding: 0; }
  /* Modal layout: fixed heading at top, scrollable content in the middle,
     fixed footer at the bottom. The footer's modal-actions contain back
     (left) + primary (right) — but the user wants both right-aligned with
     back to the LEFT of primary, so we use a flex row with both pushed
     right via justify-content: flex-end. */
  .modal-content { height: 520px; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-content > #modal-title { flex-shrink: 0; margin: 0 0 12px; }
  .modal-content > #modal-step { flex: 1; overflow-y: auto; min-height: 0; }
  .modal-content > .modal-footer { flex-shrink: 0; margin-top: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  /* /create modal: continue and back buttons must have the same height.
     .btn-ghost has a 1px border; .btn-primary has none. Add a matching
     transparent border to .btn-primary so the two line up. */
  .modal-actions .btn-primary,
  .modal-actions .btn-ghost { padding: 8px 16px; font-size: 0.9rem; border-radius: 6px; }
  .modal-actions .btn-primary { border: 1px solid transparent; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); cursor: pointer; }
  .btn-ghost:hover { background: var(--bg-secondary); }
</style>

<form id="create-form" onsubmit="return false">
  <input id="topic" type="hidden" name="topic" value="">
  <input id="name_en" class="borderless-input" name="name_en" placeholder="{{ _('create.name') }}" autocomplete="off">
  <input id="formula_id" class="borderless-input detail-desc" name="formula_id_display" placeholder="{{ _('create.formula_id') }}" autocomplete="off">

  <div class="breadcrumb-bar" id="topic-bar">
    <span>{{ _('create.topic') }}</span>
  </div>

  <div class="detail-meta">
    <span id="dim-display">{{ _('detail.dimensions') }}: $\varnothing$</span>
    <div class="diff-row">
      <span>{{ _('detail.difficulty') }}:</span>
      <div class="diff-sliders">
        <div class="diff-track"></div>
        <div class="diff-fill" id="diff-fill-create"></div>
        <input id="difficulty" name="difficulty" type="range" min="1" max="10" value="2">
      </div>
      <span id="diff-display">2/10</span>
    </div>
  </div>

  <div class="formula-box">
    <div id="formula-math" class="formula-placeholder">$$F = ma$$</div>
    <span id="formula-tex" class="hidden">F = ma</span>
    <div class="formula-copy-wrap">
      <button class="formula-copy-btn" data-action="toggle-copy-menu" type="button">
        <i data-lucide="copy" width="16" height="16"></i>
      </button>
      <div class="dropdown-menu formula-copy-menu" id="formula-copy-menu">
        <button data-action="copy-formula-latex" type="button">LaTeX</button>
        <button data-action="copy-formula-unicode" type="button">Unicode</button>
        <button data-action="copy-formula-image-png" type="button">PNG</button>
        <button data-action="copy-formula-image-svg" type="button">SVG</button>
      </div>
    </div>
  </div>

  <textarea id="equation" name="equation" class="text-field auto-grow" rows="2" placeholder="force = mass mul acceleration" spellcheck="false"></textarea>

  <textarea id="description" name="description" class="text-field auto-grow" style="margin-top: 8px" rows="2" placeholder="{{ _('create.description') }}" spellcheck="false"></textarea>

  <textarea id="links" name="links" class="text-field auto-grow" style="margin-top: 8px" rows="2" placeholder="{{ _('create.links') }}" spellcheck="false"></textarea>

  <div class="detail-section" style="margin-top: 12px;">
    <div id="var-overrides"></div>
  </div>

  <div class="detail-section">
    <button class="btn-primary" id="continue-btn" type="submit" data-action="continue-to-sql">{{ _('create.continue') }}</button>
  </div>
</form>

<div class="modal-overlay" id="sql-modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <button class="modal-close formula-copy-btn" type="button" aria-label="Close" data-action="close-modal">
      <i data-lucide="x" width="16" height="16"></i>
    </button>
    <h2 id="modal-title"></h2>
    <div id="modal-step"></div>
    <div class="modal-footer" id="modal-footer">
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const t = (path, fallback) => {
    const ui = window._localeUI || {};
    const parts = path.split('.');
    let cur = ui;
    for (const p of parts) { if (cur && typeof cur === 'object' && p in cur) cur = cur[p]; else return fallback; }
    return cur || fallback;
  };

  const renderMathIn = (el) => { try { renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],macros:window._KATEX_MACROS||{}}); } catch(e) {} };
  function setHTML(el, html) {
    el.innerHTML = typeof html === 'string' ? html : '';
    if (typeof renderMathInContent === 'function') renderMathInContent();
    if (el) renderMathIn(el);
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  // ---------- Token sidebar (server-rendered) ----------
  function loadTokenSidebar() {
    fetch('/create/token-sidebar')
      .then((r) => r.text())
      .then((html) => setHTML($('sidebar-left-inner'), html));
  }

  function filterTokenSidebar(query) {
    const q = (query || '').toLowerCase().trim();
    $('sidebar-left-inner').querySelectorAll('.token-list').forEach((grid) => {
      let visible = 0;
      grid.querySelectorAll('.qty-result').forEach((el) => {
        const match = !q || (el.dataset.search || '').includes(q);
        el.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      const empty = grid.nextElementSibling;
      const collapsed = grid.dataset.collapsed === '1';
      if (empty && empty.classList.contains('token-empty')) {
        empty.style.display = (visible === 0 && !collapsed) ? 'block' : 'none';
      }
    });
  }

  // ---------- Equation preview (debounced server call) ----------
  // Two endpoints:
  //   /api/preview             — equation → {variables, dim_latex, latex}
  //                              (no overrides; used to seed the override
  //                               inputs table when the variables change)
  //   /create/preview-render   — equation + overrides → {latex, dim_latex,
  //                              detail_items} (used to refresh the live
  //                              LaTeX + chips as the user types/overrides)
  let previewSeq = 0, previewTimer = null;
  let lastVariablesKey = '';
  function collectOverrides() {
    const fd = new FormData();
    document.querySelectorAll('#var-overrides input[name^="override["]').forEach((inp) => {
      if (inp.value) fd.append(inp.name, inp.value);
    });
    return fd;
  }
  function variablesKey(vars) {
    return (vars || []).map((v) => v.key || (v.id + '|' + (v.alias || ''))).join(',');
  }
  // Build a <tr> for the var-table: cell + 3 <input> overrides. Used by
  // both the main override table and the per-language translate page.
  // `form` is the form id to associate with the inputs (HTML5 form= attr).
  // `occ` is an optional 1-based occurrence index used to disambiguate
  // duplicate rows (e.g. the same quantity appearing twice unaliased).
  function overrideRow(key, symbol, displayName, alias, form, namePrefix, opts, occ) {
    const symCell = symbol ? '<span class="qty-symbol"></span>' : '';
    const occTag = occ ? ' <span class="qty-occ">#' + occ + '</span>' : '';
    const cellBody = symCell + ' ' + esc(displayName) + (alias ? '[' + esc(alias) + ']' : '') + occTag;
    const input = (field) => {
      const seed = (opts && opts[field]) || {};
      return '<input data-field="' + field + '" form="' + form + '" name="' + namePrefix + '[' + esc(key) + '][' + field + ']"'
        + ' placeholder="' + esc(seed.placeholder || '') + '"'
        + (seed.value ? ' value="' + esc(seed.value) + '"' : '')
        + ' class="text-field">';
    };
    return '<tr data-symbol="' + esc(symbol) + '" data-key="' + esc(key) + '">'
      + '<td class="qty-sym-cell">' + cellBody + '</td>'
      + '<td>' + input('symbol') + '</td>'
      + '<td>' + input('name') + '</td>'
      + '<td>' + input('label') + '</td>'
      + '</tr>';
  }
  // Compute a per-symbol/alias disambiguator: when the same id+alias
  // appears more than once, return a 1-based occurrence index for each;
  // otherwise return null (no tag needed).
  function occurrenceIndices(vars) {
    const counts = {};
    const idx = {};
    for (const v of (vars || [])) {
      const t = v.id + '|' + (v.alias || '');
      counts[t] = (counts[t] || 0) + 1;
    }
    const seen = {};
    for (const v of (vars || [])) {
      const t = v.id + '|' + (v.alias || '');
      if (counts[t] > 1) {
        seen[t] = (seen[t] || 0) + 1;
        idx[v.key] = seen[t];
      }
    }
    return idx;
  }
  function renderOverrideTable(vars) {
    const wrap = $('var-overrides');
    if (!wrap) return;
    const real = vars && vars.length ? vars : [];
    // Always render at least 3 rows. The first `real.length` are filled in
    // with quantity data; the rest are placeholder rows that are
    // muted/grayed out. Inputs are still emitted (form POSTs them as
    // empty strings) so the server-side parser doesn't see missing keys.
    const totalRows = Math.max(3, real.length);
    const occ = occurrenceIndices(real);
    let rows = '';
    for (let i = 0; i < totalRows; i++) {
      const v = real[i];
      if (v) {
        rows += overrideRow(
          v.key || (v.id + '|' + (v.alias || '')),
          v.symbol || '',
          localiseName(v.name, v.id),
          v.alias,
          'create-form',
          'override',
          {
            symbol: { placeholder: t('unit.symbol') },
            name:   { placeholder: t('create.placeholder_name') },
            label:  { placeholder: t('create.placeholder_label') },
          },
          occ[v.key]
        );
      } else {
        rows += '<tr class="qty-row-placeholder">'
          + '<td class="qty-sym-cell">&nbsp;</td>'
          + '<td><input disabled class="text-field" placeholder=""></td>'
          + '<td><input disabled class="text-field" placeholder=""></td>'
          + '<td><input disabled class="text-field" placeholder=""></td>'
          + '</tr>';
      }
    }
    const headers = [t('detail.quantity'), t('create.column_symbol_override'), t('create.column_name_override'), t('create.column_label')];
    let thead = '<tr>';
    for (const h of headers) thead += '<th>' + esc(h) + '</th>';
    thead += '</tr>';
    wrap.innerHTML = '<table class="var-table"><thead>' + thead + '</thead><tbody>' + rows + '</tbody></table>';
    if (typeof katex !== 'undefined') {
      wrap.querySelectorAll('tr[data-symbol]').forEach((tr) => {
        const sym = tr.dataset.symbol;
        if (!sym) return;
        const target = tr.querySelector('.qty-symbol');
        if (target) katex.render(sym, target, { displayMode: false, throwOnError: false });
      });
    }
    if (typeof renderMathInContent === 'function') renderMathInContent();
  }
  function renderPreviewLaTeX(latex) {
    const mathEl = $('formula-math');
    const texEl = $('formula-tex');
    if (mathEl) {
      if (latex) {
        // Real formula: render with normal text color. KaTeX's own
        // stylesheet colors win; no .formula-placeholder class is set.
        mathEl.classList.remove('formula-placeholder');
        mathEl.textContent = '$$' + latex + '$$';
      } else {
        // Placeholder: muted color, but still let auto-render produce a
        // real KaTeX node so the font matches the rest of the math.
        mathEl.classList.add('formula-placeholder');
        mathEl.textContent = '$$F = ma$$';
      }
    }
    if (texEl) texEl.textContent = latex || 'F = ma';
  }
  function localiseName(value, fallback) {
    if (!value) return fallback;
    if (typeof value !== 'string' || !value.trim().startsWith('{')) return value;
    try {
      const obj = JSON.parse(value);
      const loc = (document.documentElement.lang || 'en-us').toLowerCase();
      return obj[loc] || obj['en-us'] || fallback;
    } catch (e) {
      return value;
    }
  }
  function updatePreview(eq) {
    clearTimeout(previewTimer);
    const seq = ++previewSeq;
    previewTimer = setTimeout(() => {
      const dimEl = $('dim-display');
      const fd = collectOverrides();
      fd.set('equation', eq);
      fetch('/create/preview-render', { method: 'POST', body: fd })
        .then((r) => r.json())
        .then((data) => {
          if (seq !== previewSeq) return;
          if (data.error) {
            $('formula-math').innerHTML = '<span class="formula-error">' + esc(data.error) + '</span>';
            $('formula-tex').textContent = '';
            dimEl.innerHTML = esc(t('detail.dimensions')) + ': <span class="dim-latex">$\\varnothing$</span>';
          } else if (data.latex) {
            renderPreviewLaTeX(data.latex);
            const dimLatex = data.dim_latex || '\\varnothing';
            const muted = !eq.trim() || dimLatex === '\\varnothing';
            dimEl.innerHTML = esc(t('detail.dimensions')) + ': <span class="dim-latex"></span>';
            dimEl.style.opacity = muted ? '0.6' : '';
            if (typeof katex !== 'undefined') katex.render(dimLatex, dimEl.querySelector('.dim-latex'), { displayMode: false, throwOnError: false });
          } else {
            renderPreviewLaTeX('');
          }
          // Regenerate the override inputs table only if the variable set changed.
          const newKey = variablesKey(data.variables);
          if (newKey !== lastVariablesKey) {
            lastVariablesKey = newKey;
            renderOverrideTable(data.variables || []);
          }
          if (typeof renderMathInContent === 'function') renderMathInContent();
        })
        .catch((err) => {
          if (seq !== previewSeq) return;
          console.error('preview failed:', err);
          showToast('Preview failed: ' + err.message, 'error');
        });
    }, 200);
  }

  // ---------- Click-to-insert at cursor (with smart spacing) ----------
  function isSep(ch) { return !ch || /\s/.test(ch) || '()[]'.indexOf(ch) !== -1; }
  function insertAtCursor(text) {
    const ta = $('equation');
    const start = ta.selectionStart, end = ta.selectionEnd;
    const before = ta.value.substring(0, start);
    const after = ta.value.substring(end);
    const padL = before.length && !isSep(before[before.length - 1]);
    const padR = after.length && !isSep(after[0]);
    const ins = (padL ? ' ' : '') + text + (padR ? ' ' : '');
    ta.value = before + ins + after;
    const pos = start + ins.length - (padR ? 1 : 0);
    ta.selectionStart = ta.selectionEnd = pos;
    ta.focus();
    updatePreview(ta.value);
  }

  // ---------- Topic breadcrumb (server-rendered) ----------
  // Single source of truth: `selectTopic(id)` updates both the right-sidebar
  // jstree and the breadcrumb. Both UI paths call into it.
  let topicSyncing = false;
  function syncTreeResetBtn(topicSelected) {
    const btn = document.getElementById('tree-select-all');
    if (btn) btn.classList.toggle('disabled', !topicSelected);
  }
  function selectTopic(id) {
    const hidden = $('topic');
    if (hidden) hidden.value = id || '';
    loadBreadcrumb(id);
    syncTreeResetBtn(!!id);
    if (window._jstree) {
      topicSyncing = true;
      try {
        window._jstree.uncheck_all();
        if (id) window._jstree.check_node(id);
      } finally {
        topicSyncing = false;
      }
    }
  }
  function loadBreadcrumb(topic) {
    const url = '/create/breadcrumb' + (topic ? '?topic=' + encodeURIComponent(topic) : '');
    fetch(url)
      .then((r) => r.text())
      .then((html) => setHTML($('topic-bar'), html));
  }

  // ---------- Modal (history stack: pick → translate × N → sql) ----------
  function openModal() { $('sql-modal').classList.add('open'); }
  function closeModal() {
    $('sql-modal').classList.remove('open');
    // Discard the in-progress flow so a future re-open starts fresh.
    flow.history = [];
    flow.translations = {};
    flow.variables = [];
  }

  // The flow object holds the multi-step translation state. `history` is a
  // stack of pages (each is {kind, ...data}); pushing goes forward, popping
  // goes back. `translations` is shared across all pages so data the user
  // entered on a previous page is preserved when they return via Back.
  const flow = {
    history: [],            // [{kind: 'pick' | 'translate' | 'sql', ...}, ...]
    translations: {},       // { 'cs-cz': { name, description, overrides } }
    variables: [],          // [{ id, alias, symbol, name, name_overwrite }, ...]
    issueUrl: null,         // populated on the SQL page
    availableLanguages: [], // [{code, name}, ...]
  };

  function currentPage() {
    return flow.history[flow.history.length - 1] || null;
  }
  function pushPage(page) {
    flow.history.push(page);
    renderPage(page);
  }
  function popPage() {
    if (flow.history.length <= 1) return; // can't pop the first page
    flow.history.pop();
    renderPage(currentPage());
  }
  function langName(code) {
    const e = flow.availableLanguages.find((l) => l.code === code);
    return e ? e.name : code;
  }
  function substituteTemplate(str, replacements) {
    return String(str).replace(/\{(\w+)\}/g, (m, k) => (k in replacements ? replacements[k] : m));
  }

  // Validate the English-only fields. Returns an array of missing labels.
  function validateEnglishFields() {
    const missing = [];
    const nameVal = ($('name_en').value || '').trim();
    const idVal = ($('formula_id').value || '').trim();
    const eqVal = ($('equation').value || '').trim();
    const descVal = ($('description').value || '').trim();
    const topicVal = $('topic') ? $('topic').value : '';
    if (!nameVal) missing.push(t('create.name').toLowerCase());
    if (!idVal) missing.push(t('create.formula_id').toLowerCase());
    if (!topicVal) missing.push(t('create.topic').toLowerCase());
    if (!eqVal) missing.push(t('create.equation').toLowerCase());
    if (!descVal) missing.push(t('create.description').toLowerCase());
    return missing;
  }

  // ---------- Page renderers ----------
  // The modal has three slots: #modal-title (h2, fixed), #modal-step
  // (scrolls), and #modal-actions inside .modal-footer (fixed at bottom).
  // Each renderer sets all three.

  function renderPage(page) {
    if (!page) return;
    $('modal-step').dataset.kind = page.kind;
    if (page.kind === 'pick') renderPickPage(page);
    else if (page.kind === 'translate') renderTranslatePage(page);
    else if (page.kind === 'sql') renderSqlPage(page);
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function setTitle(text) { $('modal-title').textContent = text; }
  function setStep(html) { $('modal-step').innerHTML = html; }
  function setActions(html) { $('modal-actions').innerHTML = html; }
  function backButtonHtml() {
    return '<button class="btn-ghost" type="button" data-action="flow-back">' +
      esc(t('create.back', 'Back')) + '</button>';
  }

  function renderPickPage(page) {
    setTitle(t('create.pick_languages_heading', 'Translate this formula into how many languages?'));
    const hint = t('create.pick_languages_hint', 'English is always included.');
    // Preserve user's prior selection (page.selected) on re-entry via Back.
    const selected = new Set(page.selected || []);
    let rows = '';
    for (const lang of flow.availableLanguages) {
      const isEn = lang.code === 'en-us';
      const id = 'lang-' + esc(lang.code);
      const checked = (isEn || selected.has(lang.code)) ? ' checked' : '';
      const disabled = isEn ? ' disabled' : '';
      // jstree-style checkbox: a custom 16x16 box tied to a hidden native
      // input. Clicking the row toggles the input via the wrapping label.
      rows +=
        '<label class="lang-row" for="' + id + '">' +
        '<input type="checkbox" id="' + id + '" data-lang-code="' + esc(lang.code) + '"' + checked + disabled + '>' +
        '<span class="lang-cb"></span>' +
        '<span class="lang-name">' + esc(lang.name) + '</span>' +
        '<span class="lang-code">(' + esc(lang.code) + ')</span>' +
        '</label>';
    }
    setStep(
      '<p class="detail-desc">' + esc(hint) + '</p>' +
      '<div class="lang-picker" id="lang-picker">' + rows + '</div>'
    );
    setActions(
      '<button class="btn-primary" type="button" data-action="flow-pick-langs-continue">' +
        esc(t('create.continue', 'Continue')) +
      '</button>'
    );
  }

  function renderTranslatePage(page) {
    const code = page.code;
    setTitle(substituteTemplate(
      t('create.translate_heading', 'Translate to {lang}'),
      { lang: langName(code) + ' (' + code + ')' }
    ));
    const prior = flow.translations[code] || {};
    const occ = occurrenceIndices(flow.variables);
    let qtyRows = '';
    for (const v of flow.variables) {
      const key = v.key || (v.id + '|' + (v.alias || ''));
      const priorOv = (prior.overrides && prior.overrides[key]) || {};
      qtyRows += overrideRow(
        key,
        v.symbol || '',
        localiseName(v.name, v.id),
        v.alias,
        'create-form',
        'tr_overrides[' + code + ']',
        {
          symbol: { placeholder: v.symbol || '', value: priorOv.symbol || '' },
          name:   { placeholder: localiseName(v.name, v.id), value: priorOv.name || '' },
          label:  { placeholder: t('create.placeholder_label'), value: priorOv.label || '' },
        },
        occ[key]
      );
    }
    // Per-language quantity overrides reuse the main form's .var-table so
    // the look matches exactly.
    const qtyTable = qtyRows
      ? '<table class="var-table"><thead><tr>' +
          '<th>' + esc(t('detail.quantity')) + '</th>' +
          '<th>' + esc(t('create.column_symbol_override')) + '</th>' +
          '<th>' + esc(t('create.column_name_override')) + '</th>' +
          '<th>' + esc(t('create.column_label')) + '</th>' +
        '</tr></thead><tbody>' + qtyRows + '</tbody></table>'
      : '';
    // Placeholders = the English content so the user knows what to translate.
    const enName = ($('name_en').value || '').trim();
    const enDesc = ($('description').value || '').trim();
    // Copy-from-en button. Click sets the field to its current value if
    // non-empty, otherwise to its placeholder (the en-us value). The icon
    // matches the sidebar's filter-btn (reset tree) look.
    const copyBtn = (field) => {
      // Pass the localised label string into the button so the toast can
      // show "Copied <label>" in the user's language without re-keying.
      const labelMap = { name: 'name', description: 'description' };
      const labelKey = labelMap[field] || field;
      return '<button class="filter-btn" type="button" data-tr-copy="' + field + '" data-tr-copy-label="' + esc(t('create.' + labelKey, field)) + '" title="Copy from English">' +
      '<i data-lucide="copy" width="16" height="16"></i></button>';
    };
    // Use <div> wrappers, not <label>, so clicking the wrapper doesn't
    // implicit-focus the input. Only clicking the copy button triggers it.
    setStep(
      '<div class="translate-form">' +
        '<div class="detail-desc"><div class="tr-label-row"><span>' + esc(t('create.name')) + '</span>' + copyBtn('name') + '</div>' +
        '<input data-tr-field="name" name="tr[' + code + '][name]" class="text-field" autocomplete="off" placeholder="' + esc(enName) + '" value="' + esc(prior.name || '') + '">' +
        '</div>' +
        '<div class="detail-desc"><div class="tr-label-row"><span>' + esc(t('create.description')) + '</span>' + copyBtn('description') + '</div>' +
        '<textarea data-tr-field="description" name="tr[' + code + '][description]" class="text-field auto-grow" rows="2" spellcheck="false" placeholder="' + esc(enDesc) + '">' + esc(prior.description || '') + '</textarea>' +
        '</div>' +
        qtyTable +
      '</div>'
    );
    setActions(
      backButtonHtml() +
      '<button class="btn-primary" type="button" data-action="flow-translate-continue">' +
        esc(t('create.continue', 'Continue')) +
      '</button>'
    );

    // Render the symbol column via KaTeX (mirrors the main override table).
    if (typeof katex !== 'undefined') {
      $('modal-step').querySelectorAll('tr[data-symbol]').forEach((tr) => {
        const sym = tr.dataset.symbol;
        if (!sym) return;
        const target = tr.querySelector('.qty-symbol');
        if (target) katex.render(sym, target, { displayMode: false, throwOnError: false });
      });
    }
    // Auto-grow every textarea in the per-language form.
    $('modal-step').querySelectorAll('textarea').forEach(bindAutoGrow);
    if (typeof renderMathInContent === 'function') renderMathInContent();
  }

  function renderSqlPage(page) {
    // No heading for the SQL step. The h3 subheadings (formula_insert,
    // token_inserts) sit above each <pre> instead.
    setTitle('');
    setStep('<h3>' + esc(t('create.formula_insert')) + '</h3><div id="sql-formula-wrap"></div><h3>' + esc(t('create.token_inserts')) + '</h3><div id="sql-token-wrap"></div>');

    const fd = buildFinalFormData();
    fetch('/create/build-sql', { method: 'POST', body: fd })
      .then(async (r) => ({ ok: r.ok, body: await r.text() }))
      .then((out) => {
        if (!out.ok) {
          const errEl = (new DOMParser().parseFromString(out.body, 'text/html')).querySelector('[data-error]');
          showToast(errEl ? errEl.dataset.error : t('create.parse_error'), 'error');
          return;
        }
        // The build-sql response contains two .sql-block elements, each
        // with its own icon-only copy button. Slot them into the wrappers
        // set up by renderSqlPage and re-initialise lucide icons for the
        // new copy buttons.
        const doc = new DOMParser().parseFromString(out.body, 'text/html');
        const blocks = doc.querySelectorAll('.sql-block');
        const wrapMap = { 'formula-sql': $('sql-formula-wrap'), 'token-sql': $('sql-token-wrap') };
        blocks.forEach((block) => {
          const pre = block.querySelector('pre');
          if (!pre) return;
          const wrap = wrapMap[pre.id];
          if (wrap) wrap.appendChild(block);
        });
        if (typeof lucide !== 'undefined') lucide.createIcons();
        flow.issueUrl = buildIssueUrl();
        setActions(
          backButtonHtml() +
          '<a class="btn-primary" id="open-issue-link" target="_blank" rel="noopener noreferrer" href="' + esc(flow.issueUrl) + '" data-action="open-issue">' +
            esc(t('create.translate_open_issue', 'Open GitHub issue')) +
          '</a>'
        );
      })
      .catch((err) => showToast(t('create.parse_error', 'Build failed') + ': ' + err.message, 'error'));
  }

  // Build a FormData that contains the English form + all collected per-
  // language translations, ready to POST to /create/build-sql.
  function buildFinalFormData() {
    const fd = new FormData($('create-form'));
    for (const [loc, tr] of Object.entries(flow.translations)) {
      if (loc === 'en-us') continue;
      if (tr.name) fd.set('tr[' + loc + '][name]', tr.name);
      if (tr.description) fd.set('tr[' + loc + '][description]', tr.description);
      if (tr.overrides) {
        for (const [key, fields] of Object.entries(tr.overrides)) {
          for (const [fld, val] of Object.entries(fields)) {
            if (val) fd.set('tr_overrides[' + loc + '][' + key + '][' + fld + ']', val);
          }
        }
      }
    }
    return fd;
  }

  // Build a prefilled GitHub new-issue URL. Title = name_en. Labels include
  // `formula` so the issue lands in the right column on the repo's board.
  // Body is the two SQL blocks (Formula + Tokens), with no metadata — the
  // equation is already inside the SQL.
  function buildIssueUrl() {
    const repo = (window._scifindRepo || 'Creeperman3000/Scifind');
    const title = ($('name_en').value || '').trim();
    const body = buildIssueBody();
    const params =
      '?title=' + encodeURIComponent(title) +
      '&labels=' + encodeURIComponent('formula') +
      '&body=' + encodeURIComponent(body);
    return 'https://github.com/' + repo + '/issues/new' + params;
  }
  function buildIssueBody() {
    const parts = [];
    const sqlBlocks = document.querySelectorAll('#modal-step pre');
    sqlBlocks.forEach((pre) => {
      const label = pre.id === 'formula-sql' ? 'Formula SQL' : 'Token SQL';
      parts.push('### ' + label);
      parts.push('```sql');
      parts.push(pre.textContent);
      parts.push('```');
      parts.push('');
    });
    return parts.join('\n').trimEnd() + '\n';
  }

  // Start the flow: validate English fields, fetch variables + available
  // languages, then push the language picker onto the history stack.
  function startCreateFlow() {
    const missing = validateEnglishFields();
    if (missing.length) {
      showToast(t('create.missing_required') + ' ' + missing.join(', '), 'error');
      return;
    }
    const fd = new FormData();
    fd.set('equation', ($('equation').value || '').trim());
    document.querySelectorAll('#var-overrides input[name^="override["]').forEach((inp) => {
      if (inp.value) fd.append(inp.name, inp.value);
    });
    fetch('/create/preview-render', { method: 'POST', body: fd })
      .then((r) => r.json())
      .then((data) => {
        flow.variables = (data && data.variables) || [];
        return fetch('/create/languages').then((r) => r.json());
      })
      .then((langs) => {
        flow.availableLanguages = (langs && langs.locales) || [];
        if (langs && langs.repo) window._scifindRepo = langs.repo;
        flow.history = [];
        flow.translations = {};
        $('modal-step').innerHTML = '';
        $('modal-actions').innerHTML = '';
        pushPage({ kind: 'pick', selected: [] });
        openModal();
      })
      .catch((err) => showToast('Could not start: ' + err.message, 'error'));
  }

  // Capture the user's checkbox selection and push the first translate page.
  function onPickLangsContinue() {
    const page = currentPage();
    if (!page || page.kind !== 'pick') return;
    const checked = [...document.querySelectorAll('#lang-picker input[type=checkbox]:checked:not([disabled])')]
      .map((el) => el.dataset.langCode)
      .filter((c) => c);
    // Remember the selection so the user sees it again if they press Back.
    page.selected = checked;
    if (!checked.length) {
      // No translations selected: skip straight to SQL.
      pushPage({ kind: 'sql' });
      return;
    }
    pushPage({ kind: 'translate', code: checked[0], queue: checked.slice(1) });
  }

  // Capture the current translation form's values into flow.translations,
  // then either go back to the picker (via Back) or push the next page.
  function onTranslateContinue() {
    const page = currentPage();
    if (!page || page.kind !== 'translate') return;
    captureTranslationForm(page.code);
    const next = page.queue[0];
    if (next) {
      pushPage({ kind: 'translate', code: next, queue: page.queue.slice(1) });
    } else {
      pushPage({ kind: 'sql' });
    }
  }

  // Pull the current translation form's values into flow.translations[code].
  function captureTranslationForm(code) {
    const step = $('modal-step');
    const nameEl = step.querySelector('[data-tr-field="name"]');
    const descEl = step.querySelector('[data-tr-field="description"]');
    const overrides = {};
    step.querySelectorAll('tr[data-key]').forEach((tr) => {
      const key = tr.dataset.key;
      const fields = {};
      tr.querySelectorAll('input[data-field]').forEach((inp) => {
        if (inp.value) fields[inp.dataset.field] = inp.value;
      });
      if (Object.keys(fields).length) overrides[key] = fields;
    });
    const entry = {};
    if (nameEl && nameEl.value.trim()) entry.name = nameEl.value.trim();
    if (descEl && descEl.value.trim()) entry.description = descEl.value.trim();
    if (Object.keys(overrides).length) entry.overrides = overrides;
    if (Object.keys(entry).length) flow.translations[code] = entry;
    else delete flow.translations[code];
  }

  // Backwards-compat alias for the data-action click handler.
  function continueToSql() { startCreateFlow(); }

  // Topbar sidebar toggles: intercept in the capture phase and call
  // base.html's `toggleSidebar()` (which already syncs the topbar icon,
  // backdrop, and dock pills). The capture-phase stop prevents base.html's
  // bubble-phase delegation from running twice.
  document.addEventListener('click', (e) => {
    const toggleEl = e.target.closest('[data-action="toggle-sidebar-left"], [data-action="toggle-sidebar-right"]');
    if (!toggleEl) return;
    e.stopImmediatePropagation();
    const side = toggleEl.dataset.action === 'toggle-sidebar-left' ? 'left' : 'right';
    if (typeof window.toggleSidebar === 'function') window.toggleSidebar(side);
  }, true);

  document.addEventListener('click', (e) => {
    const tokenItem = e.target.closest('.qty-result[data-insert]');
    if (tokenItem) { insertAtCursor(tokenItem.dataset.insert); return; }

    const topicItem = e.target.closest('.topic-menu-item[data-id]');
    if (topicItem) {
      e.preventDefault(); e.stopPropagation();
      closeAllMenus();
      selectTopic(topicItem.dataset.id);
      return;
    }

    const crumbNode = e.target.closest('.topic-current[data-id]');
    if (crumbNode && !crumbNode.classList.contains('has-menu')) {
      const bar = $('topic-bar');
      const parents = [...bar.querySelectorAll('.topic-current[data-id]')];
      const idx = parents.indexOf(crumbNode);
      const parent = parents[idx - 1];
      selectTopic(parent ? parent.dataset.id : '');
      return;
    }

    const trigger = e.target.closest('.topic-dropdown-trigger');
    if (trigger) {
      e.preventDefault(); e.stopPropagation();
      const menu = trigger.nextElementSibling;
      if (!menu) return;
      const wasOpen = menu.classList.contains('open');
      closeAllMenus();
      if (!wasOpen) menu.classList.add('open');
      return;
    }

    const action = e.target.closest('[data-action]');
    // Copy-from-en buttons live inside the per-language form. They have
    // a [data-tr-copy] attribute and no [data-action] so we look for
    // them here, before the action switch.
    const trCopy = e.target.closest('[data-tr-copy]');
    if (trCopy) {
      const field = trCopy.dataset.trCopy;
      const target = document.querySelector('[data-tr-field="' + field + '"]');
      if (target) {
        // Copy the current value to the clipboard if non-empty, otherwise
        // the placeholder (the en-us value). Mirrors the toast pattern
        // used elsewhere in the app.
        const text = target.value || target.placeholder || '';
        // Localised label passed straight through from data-tr-copy-label;
        // do NOT transform the case (e.g. "LaTeX", "PNG" should stay as-is).
        const label = trCopy.dataset.trCopyLabel || field;
        const copied = (window._localeUI && window._localeUI.toast && window._localeUI.toast.copied) || 'Copied';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(copied + ' ' + label, 'success'))
            .catch((e) => showToast(((window._localeUI && window._localeUI.toast && window._localeUI.toast.copy_failed) || 'Copy failed') + ': ' + e.message, 'error'));
        }
      }
      return;
    }
    if (!action) return;
    switch (action.dataset.action) {
      case 'close-modal': closeModal(); break;
      case 'continue-to-sql': continueToSql(); break;
      case 'flow-pick-langs-continue': onPickLangsContinue(); break;
      case 'flow-translate-continue': onTranslateContinue(); break;
      case 'flow-back': {
        // Persist any in-progress translation values before popping so
        // re-entering the page shows what the user typed.
        const page = currentPage();
        if (page && page.kind === 'translate') captureTranslationForm(page.code);
        popPage();
        break;
      }
      case 'open-issue': {
        // The link's href is already set; just open it in a new tab.
        if (flow.issueUrl) window.open(flow.issueUrl, '_blank', 'noopener,noreferrer');
        break;
      }
      case 'copy-formula-sql':
      case 'copy-token-sql': {
        const pre = action.dataset.action === 'copy-formula-sql' ? $('formula-sql') : $('token-sql');
        if (pre && navigator.clipboard) {
          const copied = (window._localeUI && window._localeUI.toast && window._localeUI.toast.copied) || 'Copied';
          navigator.clipboard.writeText(pre.textContent)
            .then(() => showToast(copied + ' SQL', 'success'))
            .catch((e) => showToast(((window._localeUI && window._localeUI.toast && window._localeUI.toast.copy_failed) || 'Copy failed') + ': ' + e.message, 'error'));
        }
        break;
      }
      case 'toggle-token-section': {
        const list = $(action.dataset.target);
        if (!list) break;
        const collapsed = list.dataset.collapsed === '1';
        list.dataset.collapsed = collapsed ? '0' : '1';
        const icon = action.querySelector('.token-section-icon');
        if (icon) {
          icon.innerHTML = '<i data-lucide="' + (collapsed ? 'chevron-up' : 'chevron-down') + '" width="16" height="16"></i>';
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        break;
      }
    }
  });

  $('sidebar-left-inner').addEventListener('input', (e) => {
    if (e.target.id === 'token-search') filterTokenSidebar(e.target.value);
  });

  // Override inputs live in #var-overrides; on change, re-render the live
  // LaTeX + chips (without re-rendering the override table itself, which
  // would steal focus from the input the user is typing in).
  $('var-overrides').addEventListener('input', (e) => {
    if (e.target.name && e.target.name.startsWith('override[')) {
      updatePreview($('equation').value);
    }
  });

  // Hover-open submenus. Sibling submenus replace each other; nested
  // submenus (descending into a child's children) keep the parent visible.
  // A short delay before opening prevents flicker, and a short delay before
  // closing lets the cursor travel from the trigger onto the submenu.
  let openSub = null, openItem = null, openTimer = 0, closeTimer = 0;
  let pendingSub = null, pendingItem = null;
  function openSubmenuNow(item, sub) {
    // Only close the previous submenu when navigating to a sibling (the new
    // item is NOT inside the currently-open submenu). Descending into a
    // nested submenu should keep the parent visible.
    if (!item || !openSub || !openSub.contains(item)) closeSubmenuNow();
    const rect = item.getBoundingClientRect();
    sub.style.top = rect.top + 'px';
    sub.style.left = rect.right + 'px';
    sub.style.display = 'block';
    const sr = sub.getBoundingClientRect();
    if (sr.right > window.innerWidth) sub.style.left = (rect.left - sr.width) + 'px';
    if (sr.bottom > window.innerHeight) sub.style.top = (window.innerHeight - sr.height - 4) + 'px';
    openSub = sub; openItem = item;
  }
  function closeSubmenuNow() {
    if (openSub) openSub.style.display = '';
    openSub = openItem = null;
  }
  function scheduleOpen(item, sub) {
    clearTimeout(openTimer); clearTimeout(closeTimer);
    pendingItem = item; pendingSub = sub;
    openTimer = setTimeout(() => { if (pendingSub === sub) openSubmenuNow(item, sub); }, 150);
  }
  function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(closeSubmenuNow, 250);
  }
  // Triggers: live inside #topic-bar. mouseover/mouseout (bubble) are good
  // enough because we always check the topmost element.
  $('topic-bar').addEventListener('mouseover', (e) => {
    const item = e.target.closest('.topic-menu-item');
    if (!item) return;
    const sub = item.querySelector(':scope > .topic-submenu');
    if (!sub) return;
    if (pendingItem === item) { clearTimeout(closeTimer); return; }
    scheduleOpen(item, sub);
  });
  $('topic-bar').addEventListener('mouseout', (e) => {
    const item = e.target.closest('.topic-menu-item');
    if (!item) return;
    if (!item.querySelector(':scope > .topic-submenu')) return;
    // relatedTarget tells us where the cursor went. If it stayed inside the
    // trigger or the open submenu, don't schedule a close.
    const to = e.relatedTarget;
    if (to && (item.contains(to) || (openSub && openSub.contains(to)))) return;
    clearTimeout(openTimer);
    scheduleClose();
  });
  // Submenu is position:fixed, outside #topic-bar — track hover on document.
  document.addEventListener('mouseover', (e) => {
    const sub = e.target.closest('.topic-submenu');
    if (!sub || sub !== openSub) return;
    clearTimeout(closeTimer);
  });
  document.addEventListener('mouseout', (e) => {
    if (!openSub) return;
    if (!openSub.contains(e.target)) return;
    const to = e.relatedTarget;
    if (to && openSub.contains(to)) return;
    if (to && openItem && openItem.contains(to)) return;
    // The pending item hasn't been opened yet (openItem still references the
    // previous submenu's parent) — check pendingItem as a fallback.
    if (to && pendingItem && pendingItem.contains(to)) return;
    scheduleClose();
  });

  function closeAllMenus() {
    clearTimeout(openTimer); clearTimeout(closeTimer);
    openSub = openItem = pendingSub = pendingItem = null;
    const bar = $('topic-bar');
    bar.querySelectorAll('.topic-children-menu').forEach((m) => m.classList.remove('open'));
    bar.querySelectorAll('.topic-submenu').forEach((m) => m.style.display = '');
  }
  document.addEventListener('click', (e) => {
    if (!$('topic-bar').contains(e.target)) closeAllMenus();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAllMenus(); closeModal(); } });

  // ---------- Name → slug + difficulty slider ----------
  const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const nameInput = $('name_en'), idInput = $('formula_id');
  nameInput.addEventListener('input', () => { if (!idInput.dataset.manual) idInput.value = slugify(nameInput.value); });
  idInput.addEventListener('input', () => { idInput.dataset.manual = idInput.value !== slugify(nameInput.value); });

  const diffInput = $('difficulty'), diffFill = $('diff-fill-create'), diffDisplay = $('diff-display');
  function updateDiffFill() {
    const pct = ((diffInput.value - diffInput.min) / (diffInput.max - diffInput.min)) * 100;
    diffFill.style.width = pct + '%';
  }
  diffInput.addEventListener('input', () => { diffDisplay.textContent = diffInput.value + '/10'; updateDiffFill(); });
  updateDiffFill();

  // ---------- Right-sidebar jstree: detach base.html's filter handlers and
  // reinitialise in radio mode so picking a topic doesn't navigate away.
  function reinitTree() {
    const $tree = window.jQuery && window.jQuery('#science-tree');
    if (!$tree || !$tree.length || !window.jQuery.fn.jstree) {
      setTimeout(reinitTree, 50);
      return;
    }
    const oldTree = $tree.jstree(true);
    if (!oldTree) { setTimeout(reinitTree, 50); return; }
    const data = window._topicTreeData || (oldTree.settings && oldTree.settings.core && oldTree.settings.core.data) || [];
    $tree.off('changed.jstree check_node.jstree uncheck_node.jstree');
    try { oldTree.destroy(); } catch (e) {}
    // Null out _jstree before creating the new tree so the ready.jstree
    // event (fired during construction) won't operate on the destroyed
    // instance via syncFilterStates / restoreTreeFromUrl.
    window._jstree = null;
    $tree.jstree({
      core: { data, themes: { icons: false, dots: false }, dblclick_toggle: false, multiple: false },
      checkbox: { keep_selected_style: false, three_state: false, cascade: '' },
      plugins: ['checkbox']
    });
    window._jstree = $tree.jstree(true);
    $tree.on('changed.jstree', () => {
      if (topicSyncing) return;
      const checked = window._jstree.get_checked(true);
      selectTopic(checked.length ? checked[0].id : null);
    });
    const sidebarRight = $('sidebar-right');
    if (sidebarRight) sidebarRight.classList.add('jstree-radio-mode');
  }

  // ---------- Auto-grow textareas ----------
  // Resize a textarea to fit its content. Starts at the natural rows and
  // grows downward as the user types. Used for Description, Links, and
  // the per-language translation form fields.
  function autoGrow(ta) {
    if (!ta) return;
    // Reset to the natural single-row height so scrollHeight reflects the
    // content size, not the previously-clamped size.
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }
  function bindAutoGrow(ta) {
    if (!ta) return;
    autoGrow(ta);
    ta.addEventListener('input', () => autoGrow(ta));
  }

  // ---------- Init ----------
  function init() {
    // /create has no filter widgets, so base.html's hasActiveFilters() would
    // throw when it reads the missing diff-min/diff-max elements. That throw
    // propagates out of openSidebar()'s exitSearch() call, leaving the sidebar
    // state mid-toggle and visibly "stuck" after the first click. Override
    // with a version that tolerates the missing inputs.
    if (typeof window.hasActiveFilters === 'function') {
      const baseHasActiveFilters = window.hasActiveFilters;
      window.hasActiveFilters = function() {
        const dimMin = document.getElementById('diff-min');
        const dimMax = document.getElementById('diff-max');
        if (!dimMin || !dimMax) return false;
        return baseHasActiveFilters();
      };
    }

    loadTokenSidebar();
    loadBreadcrumb('');
    reinitTree();
    syncTreeResetBtn(false);
    // Render the quantity overrides table with no variables so the user
    // sees 3 placeholder rows up front.
    renderOverrideTable([]);
    $('equation').addEventListener('input', (e) => updatePreview(e.target.value));
    // Auto-grow Description and Links textareas. Also: the per-language
    // form (rendered into #modal-step) registers its textareas via
    // bindAutoGrow() inside renderTranslatePage.
    bindAutoGrow($('equation'));
    bindAutoGrow($('description'));
    bindAutoGrow($('links'));
    // Intercept clicks on the tree-select-all button during capture phase on a
    // parent element, BEFORE the event reaches the target. base.html registers a
    // bubble-phase handler on this button that would call check_all()+applyFilters()
    // and replace the main content (fetchContent), breaking the create form.
    // By stopping propagation here the event never reaches the button itself.
    const sidebarRight = $('sidebar-right');
    if (sidebarRight) sidebarRight.addEventListener('click', (e) => {
      if (e.target.closest('#tree-select-all')) {
        e.stopImmediatePropagation();
        e.preventDefault();
        selectTopic(null);
      }
    }, true);
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
{% endblock %}
